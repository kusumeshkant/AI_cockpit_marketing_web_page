name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch supersedes an in-flight run — except on main,
# where cancelling could abort a production deploy half way through.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    # NOTE: this job's name is the required status check on main. Renaming it
    # silently removes the protection, so change the ruleset first if it must.
    name: lint · types · build · tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Job-wide: the build bakes these in, and the header tests assert against
    # the same values. Setting them per-step let the two disagree.
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_NOINDEX: ${{ vars.NEXT_PUBLIC_NOINDEX }}

    steps:
      - uses: actions/checkout@v5

      - name: Use Node LTS
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and type-check
        run: npm run lint

      # Built with the same variables the deploy uses, so the artifact that is
      # tested below is byte-for-byte what ships.
      - name: Build (static export)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload static export
        uses: actions/upload-artifact@v7
        with:
          name: static-export
          path: out/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Forks never get repository secrets, and must never be able to deploy.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    # One deploy at a time per target, and never cancel one mid-flight.
    concurrency:
      group: pages-deploy-${{ github.event_name == 'push' && 'production' || github.head_ref }}
      cancel-in-progress: false

    permissions:
      contents: read
      pull-requests: write # only for the preview-URL comment

    steps:
      - name: Download the tested static export
        uses: actions/download-artifact@v8
        with:
          name: static-export
          path: out

      # Production is only ever the main branch; everything else is a preview.
      - name: Resolve target branch
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          else
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name ai-cockpit
            --branch ${{ steps.target.outputs.branch }}
            --commit-dirty=true

      - name: Comment the preview URL
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          URL: ${{ steps.deploy.outputs.deployment-url }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        # --repo is required: this job never checks the source out, so gh has no
        # git remote to infer the repository from.
        run: |
          body="Cloudflare Pages preview for \`${{ steps.target.outputs.branch }}\`: $URL"
          gh pr comment "$PR" --repo "$REPO" --body "$body" --edit-last \
            || gh pr comment "$PR" --repo "$REPO" --body "$body"
